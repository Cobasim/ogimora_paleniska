<!doctype html>
<html lang="pl" data-strona="start">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <meta name="description" content="Darmowe generatory projektów z blachy: stalowe palenisko ogrodowe i kostka do nauki spawania. Ustawiasz wymiary i wzór, pobierasz plik DXF do cięcia laserem lub plazmą.">
  <title>OGIMORA — darmowe projekty ze stali: palenisko i kostka do spawania (DXF)</title>
  <script>
    // Do wersji 0.3.x generator paleniska był pod adresem głównym. Stare linki (kod kształtu, projekt, „od nowa”) idą teraz do /firepit/.
    if (/[#&]kod=/.test(location.hash) || /[?&](p|nowy|plik|projekt)=/.test(location.search)) location.replace(new URL('firepit/', location.href.split(/[?#]/)[0]).href + location.search + location.hash);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
  <link rel="stylesheet" href="strona.css?v=6">
  <link rel="stylesheet" href="naglowek.css?v=3">
  <link rel="stylesheet" href="prosty.css?v=9">
  <link rel="stylesheet" href="start.css?v=2">
  <script type="module" src="js/i18n.js"></script>
</head>
<body class="start">
  <header class="ob">
    <a class="ob-brand" href="./" aria-label="OGIMORA"><img src="img/logo.svg" alt=""><span>OGIMORA</span></a>
    <button type="button" class="ob-opinia" id="opBtn" title="Napisz, co zmienić"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Napisz, co zmienić</span></button>
    <div class="ob-lang" role="group" aria-label="Język / Language"><button type="button" data-l="pl">PL</button><button type="button" data-l="en">EN</button></div>
  </header>
  <main class="start-main" id="start"><!--START--><!--/START--></main>

  <dialog id="opDlg" class="dl" aria-labelledby="opT">
    <button type="button" class="dl-x" data-close aria-label="Zamknij">✕</button>
    <h2 id="opT">Napisz, co zmienić</h2>
    <p class="dl-sub">Strona testowa — Twój odzew decyduje, co powstanie dalej.</p>
    <form id="opForm">
      <label class="dl-t"><span>Kilka słów</span><textarea name="tekst" rows="4" required></textarea></label>
      <label class="dl-t"><span>E-mail <small>(nieobowiązkowo, jeśli chcesz odpowiedź)</small></span><input type="email" name="email" class="op-mail" autocomplete="email"></label>
      <label class="hp">www<input name="www" tabindex="-1" autocomplete="off"></label>
      <button type="submit" class="cta"><span class="cta-icon">→</span><span><b>Wyślij</b><small id="opOk">trafia prosto do mnie</small></span></button>
    </form>
  </dialog>

  <script type="module" src="js/pasek.js"></script>
  <script type="module" src="js/start.js"></script>
  <script type="module" src="js/opinia.js"></script>
  <script type="module" src="js/info.js"></script>
</body>
</html>
